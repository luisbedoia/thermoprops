    <script>
      // The installed app opens on its home, not on the website's landing:
      // before the first paint, so the landing is never seen there. Keep in
      // step with src/lib/installed.ts. (Apps installed before /home existed
      // still start at the landing's address.)
      var toHome =
        /^\/thermoprops\/?$/.test(location.pathname) &&
        (matchMedia(
          "(display-mode: standalone), (display-mode: minimal-ui), (display-mode: fullscreen), (display-mode: window-controls-overlay)",
        ).matches ||
          navigator.standalone === true);
      if (toHome) location.replace("/thermoprops/home/" + location.search);
      // The page's language (see src/i18n/index.ts, and keep the key and
      // the addresses in step): pages with an address per language are in
      // theirs, and a Spanish one (/es/...) also makes it the visitor's
      // choice; the others in the visitor's choice, else English. A Spanish
      // visitor on an English address of those (the landing, /fluids/...)
      // goes to the Spanish one. A built page in another language than the
      // visitor's stays hidden until the app draws it in theirs (main.tsx).
      (function () {
        var html = document.documentElement;
        var path = location.pathname;
        var base = /^\/thermoprops(\/|$)/.test(path) ? "/thermoprops/" : "/";
        var rel = "/" + path.slice(base.length);
        var spanish = /^\/es(\/|$)/.test(rel);
        var english = /^\/fluids(\/|$)/.test(rel);
        var saved = null;
        try {
          if (spanish) localStorage.setItem("thermoprops.locale", "es");
          saved = localStorage.getItem("thermoprops.locale");
        } catch (e) {}
        if (saved === "es" && !toHome) {
          if (rel === "/") location.replace(base + "es/" + location.search);
          else if (english)
            location.replace(
              base + "es/fluidos" + rel.slice(7) + location.search,
            );
        }
        var lang = spanish || (saved === "es" && !english) ? "es" : "en";
        html.dataset.built = html.lang;
        if (lang !== html.lang) {
          html.lang = lang;
          html.classList.add("locale-pending");
        }
      })();
    </script>
