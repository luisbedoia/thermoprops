<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // The installed app opens on its home, not on the website's landing:
      // before the first paint, so the landing is never seen there. Keep in
      // step with src/lib/installed.ts. (Apps installed before /home existed
      // still start at the landing's address.)
      if (
        /^\/thermoprops\/?$/.test(location.pathname) &&
        (matchMedia(
          "(display-mode: standalone), (display-mode: minimal-ui), (display-mode: fullscreen), (display-mode: window-controls-overlay)",
        ).matches ||
          navigator.standalone === true)
      ) {
        location.replace("/thermoprops/home/" + location.search);
      }
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-visual"
    />

    <!-- Primary SEO -->
    <title>Thermoprops – Thermodynamic Properties Calculator</title>
    <meta
      name="description"
      content="Free online calculator for thermodynamic properties of fluids and refrigerants. Compute temperature, pressure, enthalpy, entropy, density and more using CoolProp. Ideal for engineers and students in thermodynamics and refrigeration."
    />
    <meta
      name="keywords"
      content="thermodynamic properties, thermodynamics calculator, CoolProp, refrigerants, fluids, enthalpy, entropy, pressure, temperature, saturation curve, PropsSI"
    />
    <meta
      name="author"
      content="Department of Mechanical Engineering, Universidad de Antioquia"
    />
    <link rel="canonical" href="https://luisbedoia.github.io/thermoprops/" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://luisbedoia.github.io/thermoprops/"
    />
    <meta
      property="og:title"
      content="Thermoprops – Thermodynamic Properties Calculator"
    />
    <meta
      property="og:description"
      content="Free online calculator for thermodynamic properties of fluids and refrigerants powered by CoolProp WebAssembly."
    />
    <meta
      property="og:image"
      content="https://luisbedoia.github.io/thermoprops/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Thermoprops: thermodynamic states, worked out. An R134a refrigeration cycle on a T–s chart, with its COP of 2.72."
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Thermoprops – Thermodynamic Properties Calculator"
    />
    <meta
      name="twitter:description"
      content="Free online calculator for thermodynamic properties of fluids and refrigerants powered by CoolProp WebAssembly."
    />
    <meta
      name="twitter:image"
      content="https://luisbedoia.github.io/thermoprops/og-image.png"
    />
    <meta
      name="twitter:image:alt"
      content="Thermoprops: thermodynamic states, worked out. An R134a refrigeration cycle on a T–s chart, with its COP of 2.72."
    />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Thermoprops",
        "url": "https://luisbedoia.github.io/thermoprops/",
        "description": "Free online calculator for thermodynamic properties of fluids and refrigerants using CoolProp.",
        "applicationCategory": "EngineeringApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires a modern browser with WebAssembly support",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "author": {
          "@type": "Organization",
          "name": "Department of Mechanical Engineering, Universidad de Antioquia",
          "parentOrganization": {
            "@type": "CollegeOrUniversity",
            "name": "Universidad de Antioquia",
            "url": "https://www.udea.edu.co"
          }
        }
      }
    </script>

    <!-- Google Analytics 4 -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-R76PJHB69S"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-R76PJHB69S");
    </script>
  </head>
  <body>
    <!-- Each page's HTML is rendered into #root at build time (scripts/postbuild.mjs). -->
    <div id="root"></div>
    <noscript>
      <p>Thermoprops needs JavaScript and WebAssembly to run.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
